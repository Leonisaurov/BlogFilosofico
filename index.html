<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ebdd" />
  <meta name="description" content="Una publicación para pensar despacio: filosofía sin prisa, una pregunta por semana y aportaciones que se leen, se editan y se responden." />
  <meta name="author" content="Blog de Filosofía" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://blog-filosofico.surge.sh/" />
  <title>Blog de Filosofía</title>

  <!--
    Previsualización al compartir (Open Graph + Twitter Card).
    Acá quedan los metadatos de la portada del sitio; js/lib/meta.js los
    actualiza al navegar (título, descripción y portada de la vista activa) y
    convierte las rutas en absolutas.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Blog de Filosofía" />
  <meta property="og:locale" content="es_AR" />
  <meta property="og:title" content="Blog de Filosofía" />
  <meta property="og:description" content="Una publicación para pensar despacio: filosofía sin prisa, una pregunta por semana y aportaciones que se leen, se editan y se responden." />
  <meta property="og:url" content="https://blog-filosofico.surge.sh/" />
  <meta property="og:image" content="https://blog-filosofico.surge.sh/assets/social-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Blog de Filosofía: el Hombre de Vitruvio dibujado en tinta café sobre papel beige." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blog de Filosofía" />
  <meta name="twitter:description" content="Una publicación para pensar despacio: filosofía sin prisa, una pregunta por semana y aportaciones que se leen, se editan y se responden." />
  <meta name="twitter:image" content="https://blog-filosofico.surge.sh/assets/social-preview.png" />
  <meta name="twitter:image:alt" content="Blog de Filosofía: el Hombre de Vitruvio dibujado en tinta café sobre papel beige." />

  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/favicon.svg" />

  <!--
    Arranque de preferencias: aplica el tema y el modo de vista ANTES del
    primer pintado, leyendo el almacenamiento local. Así no aparece un instante
    el tema o la vista equivocados. Si no hay preferencia (o falla), quedan los
    valores por defecto: modo claro y feed vertical.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      var theme = "light";
      var viewMode = "feed";
      try {
        var raw = window.localStorage.getItem("blogfilosofia.preferencias.v1");
        var prefs = raw ? JSON.parse(raw) : null;
        if (prefs) {
          if (prefs.theme === "dark") theme = "dark";
          if (prefs.viewMode === "grid") viewMode = "grid";
        }
      } catch (error) {
        /* almacenamiento no disponible: se usan los valores por defecto */
      }
      root.setAttribute("data-theme", theme);
      root.setAttribute("data-view-mode", viewMode);
    })();
  </script>

  <!-- Sistema visual: tokens y tipografía → layout → tarjeta → home →
       secciones → lector → menú → configuración → editor → Markdown →
       responsive -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/card.css" />
  <link rel="stylesheet" href="./css/home.css" />
  <link rel="stylesheet" href="./css/sections.css" />
  <link rel="stylesheet" href="./css/reader.css" />
  <link rel="stylesheet" href="./css/menu.css" />
  <link rel="stylesheet" href="./css/settings.css" />
  <link rel="stylesheet" href="./css/editor.css" />
  <link rel="stylesheet" href="./css/editorial.css" />
  <link rel="stylesheet" href="./css/markdown.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
  <!-- Salto de teclado al contenido principal (véase js/main.js: evita que el
       hash cambie y dispare el router). -->
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <!-- Estado de arranque: se ve antes de que JS monte la portada y desaparece
       en cuanto termina (js/main.js). Fijo para no desplazar el contenido. -->
  <div class="boot-loader" id="boot-loader" role="status" aria-live="polite">
    Preparando la lectura…
  </div>

  <!--
    Capas del fondo (de atrás hacia adelante):
      1. Color beige + grano de papel (body, en css/tokens.css)
      2. .wallpaper  → papel tapiz filosófico ilustrado (capa decorativa)
      3. .app        → interfaz y contenido
  -->
  <div class="wallpaper" aria-hidden="true">
    <span class="wallpaper__item wallpaper__item--phi"></span>
    <span class="wallpaper__item wallpaper__item--vitruvio"></span>
    <span class="wallpaper__item wallpaper__item--socrates"></span>
    <span class="wallpaper__item wallpaper__item--column"></span>
    <span class="wallpaper__item wallpaper__item--vitruvio-old"></span>
  </div>

  <!--
    Estructura de tres zonas (fijas arriba y abajo, scroll solo en el centro):
      .site-header → encabezado fijo (renderizado por js/components/header.js)
      .home        → portada editorial (carta, pregunta, destacado, ritmos)
      .feed        → lectura continua con scroll snap (js/components/feed.js)
      .home-grid   → cuadrícula de lectura (preferencia en Configuración)
      .index-view  → índice general (js/components/index-view.js)
      .question    → pregunta de la semana (js/components/question.js)
      .info        → carta, política editorial y periodicidades
      .sections    → explorador temático
      .dock        → zona inferior reservada
      .reader      → vista de lectura de un artículo
      .editor      → editor de aportaciones
  -->
  <div class="app" id="app" data-view="home">
    <div id="site-header" class="site-header-slot"></div>

    <!-- Único <main> de la página: permanece en todas las vistas. Dentro de él
         conviven las distintas vistas; solo una es visible a la vez. -->
    <main class="app__main" id="contenido" tabindex="-1">
      <!-- Portada editorial: no es un feed. El feed vive en #/leer. -->
      <section class="home" id="home" aria-label="Portada"></section>

      <section class="feed" id="feed" tabindex="0" aria-label="Lectura continua">
        <div class="feed__track" id="feed-track"></div>
      </section>

      <!-- Cuadrícula de lectura: misma fuente de datos y mismas tarjetas que el
           feed. La preferencia decide cuál se muestra en #/leer. -->
      <div class="home-grid" id="home-grid" role="region" aria-label="Lectura en cuadrícula"></div>

      <!-- Índice general y pregunta de la semana. -->
      <section class="index-view" id="index" aria-label="Índice general"></section>
      <section class="question" id="question" aria-label="Pregunta de la semana"></section>
      <section class="info" id="information" aria-label="Información"></section>

      <!-- Explorador temático (rutas #/secciones y #/secciones/<slug>):
           ocupa la zona central conservando el encabezado y el menú. -->
      <section class="sections" id="sections" hidden aria-label="Secciones"></section>

      <!-- Zona inferior: intencionalmente vacía. No agregar contenido por ahora. -->
      <div class="dock" id="dock" aria-hidden="true"></div>

      <section class="reader" id="reader" hidden aria-label="Lectura del artículo"></section>

      <!-- Editor Markdown de aportaciones (ruta #/aportar). -->
      <section class="editor" id="editor" hidden aria-label="Editor de aportaciones"></section>
    </main>
  </div>

  <noscript>
    <div class="noscript">
      <h1>Blog de Filosofía</h1>
      <p>Esta publicación se genera con JavaScript para poder ampliar los textos desde una única fuente de datos. Activá JavaScript para leer la portada, el índice y las aportaciones.</p>
    </div>
  </noscript>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
